name: Source preview checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  # Saving a Cargo cache needs this. It does not grant write access to the repo.
  actions: write

concurrency:
  group: source-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-preview:
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install the repository-pinned Windows GNU toolchain
        run: |
          $manifest = Get-Content rust-toolchain.toml -Raw
          if ($manifest -notmatch '(?m)^channel = "([^"]+)"') { throw 'Missing pinned toolchain' }
          $toolchain = "$($Matches[1])-x86_64-pc-windows-gnu"
          rustup toolchain install $toolchain --profile minimal --component rustfmt --component clippy --target x86_64-unknown-none
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "RUSTUP_TOOLCHAIN=$toolchain" >> $env:GITHUB_ENV
      - name: Cache Cargo registry and build outputs
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Check source formatting
        run: |
          cargo xtask fmt --check
          exit $LASTEXITCODE
      - name: Lint with clippy
        run: |
          # Report the workspace warns and fail only on deny. `-D warnings` is
          # `cargo xtask clippy`, and using it here would turn the pedantic
          # rollout into a red preview. This step lints the host half and the
          # shipped kernel. The self-test and refuse-pci graphs stay on the
          # local gate so this job keeps its 20-minute budget.
          cargo clippy --all-targets --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo kclippy --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify supply chain
        run: |
          cargo xtask supply-chain
          exit $LASTEXITCODE
      - name: Verify vendored inputs
        run: |
          cargo xtask verify-vendor
          exit $LASTEXITCODE
      - name: Compile the shipped kernel
        run: |
          cargo xtask build --release
          exit $LASTEXITCODE
      - name: Check decisions
        run: |
          cargo test --locked -p xtask --lib decisions::tests::
          exit $LASTEXITCODE
      - name: Check documentation and registries
        run: |
          cargo test --locked -p xtask --lib prose::tests::
          exit $LASTEXITCODE
