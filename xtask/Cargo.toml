[package]
name = "xtask"
description = "Build orchestrator: pure-Rust disk imaging, QEMU and VMware runners, the CI gate."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# Outside the workspace lints, whose missing_docs is noise here; a dead doc link is still a defect.
[lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"
redundant_explicit_links = "deny"

[dependencies]
acpi-tables.workspace = true
elf64 = { workspace = true }
anyhow.workspace = true
fat32.workspace = true
fatfs.workspace = true
fscommon.workspace = true
fs_at.workspace = true
panic-record.workspace = true
proc-macro2.workspace = true
syn.workspace = true
wizzy-handoff.workspace = true

[target.'cfg(windows)'.dependencies]
command-group.workspace = true
getrandom.workspace = true
winapi-util.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true
