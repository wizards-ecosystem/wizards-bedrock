[package]
name = "xtask"
description = "Build orchestrator: pure-Rust disk imaging, QEMU and VMware runners, the CI gate."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# No `[lints] workspace = true`: missing_docs on build tooling is noise (D-22).
# The doc-link lints are not noise, though — a link that no longer resolves is a
# defect wherever it lives — so they are taken on their own.
[lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"
redundant_explicit_links = "deny"

[dependencies]
elf64 = { workspace = true }
anyhow.workspace = true
fat32.workspace = true
fatfs.workspace = true
fscommon.workspace = true
