\* Configuration for Ring.tla.
\*
\* Small numbers on purpose. The state space is what matters, not the size:
\* four submission slots against eight completion slots reaches every shape the
\* admission rule has, and a larger ring adds states without adding cases.
\* `MaxOperations` bounds the run so the space is finite.

SPECIFICATION Spec

CONSTANTS
    SubmissionSlots = 4
    CompletionSlots = 8
    MaxOperations = 12

\* The design property first, so a failure is reported by the name that says
\* what went wrong rather than by the type invariant it also breaks.
INVARIANTS
    NoDroppedCompletion
    ReservationsAreOperations
    OneCompletionPerOperation
    NothingVanishes
    TypeOK

\* Deadlock checking off, deliberately. `MaxOperations` bounds the run so the
\* state space is finite, and the state where every operation has been admitted
\* and reaped has no action enabled — which TLC calls a deadlock and which is
\* an artefact of the bound, not of the protocol. Turning it off costs nothing
\* here because the interesting property is safety: with no fairness at all,
\* userspace stopping for ever is a *permitted* behaviour and not a fault.
CHECK_DEADLOCK FALSE
