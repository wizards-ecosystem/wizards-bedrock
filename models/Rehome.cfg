\* Configuration for Rehome.tla. Three worlds and two re-homes per end let both ends move at once, bounce, and lose the world they left.

SPECIFICATION Spec

CONSTANTS
    WorldCount = 3
    MovesA = 2
    MovesB = 2
    Writes = 1
    WaitBound = 3
    FollowBound = 2
    ForwardedOutlives = TRUE
    WriteWaitsFreeze = TRUE
    Recheck = TRUE

INVARIANTS
    Link
    Conservation
    NoMutualWait
    Bound
    TypeOK

PROPERTIES
    PeerClosed
    EveryRehomeEnds
    EveryWriteEnds

CHECK_DEADLOCK FALSE
