\* Configuration for Call.tla. Two calls on one cell let a reply right outlive its call.

SPECIFICATION Spec

CONSTANTS
    Calls = 2
    GenerationChecked = TRUE

INVARIANTS
    OneOutcome
    ReplyOnce
    ReceivedNeverPeerClosed
    Conservation
    TypeOK

PROPERTIES
    EveryCallEnds

CHECK_DEADLOCK FALSE
