\* Configuration for Shootdown.tla. Three CPUs with two of them unmapping give concurrent
\* requests, a gap in a CPU's generations and a requester that answers another's flush.

SPECIFICATION Spec

CONSTANTS
    CpuCount = 3
    PageCount = 2
    StaleSlotFlushes = TRUE

INVARIANTS
    FreedOnlyWhenFlushed
    CachedOnlyUnderASlot
    TypeOK

PROPERTIES
    FlushesComplete

CHECK_DEADLOCK FALSE
