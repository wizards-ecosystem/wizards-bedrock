\* Configuration for Rehome.tla. One end bounces four times while the other makes one re-home, so its walk meets every freeze and forward the bounce leaves.

SPECIFICATION Spec

CONSTANTS
    WorldCount = 3
    MovesA = 4
    MovesB = 1
    Writes = 1
    WaitBound = 3
    FollowBound = 2
    ForwardedOutlives = TRUE
    WriteWaitsFreeze = TRUE
    Recheck = TRUE

INVARIANTS
    Bound
    Conservation
    NoMutualWait
    TypeOK

CHECK_DEADLOCK FALSE
