[package]
name = "wizard-kernel"
description = "The Wizard's OS kernel: no_std, higher-half, no hand-written `unsafe`."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Compiles the boot-time self-checks and the QEMU exit device into the kernel.
# Enabled only by `cargo xtask test-boot`; never in a shipped image.
selftest = []

[dependencies]
noto-sans-mono-bitmap.workspace = true
wost = { path = "../wost" }
