[toolchain]
# Pinned exactly: clippy gains lints every six weeks, and a floating channel lets CI go red from
# a toolchain release rather than a commit. Bump deliberately.
channel = "1.97.1"
profile = "minimal"
# rust-mingw is absent on purpose: it does not exist for other hosts and naming it breaks Linux
# CI; rustup installs it with the windows-gnu host toolchain regardless.
components = ["rustfmt", "clippy"]
targets = ["x86_64-unknown-none"]
