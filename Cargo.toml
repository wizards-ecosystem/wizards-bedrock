[workspace]
# A virtual manifest inherits no edition, so without this cargo falls back to resolver 1.
resolver = "3"
members = [
    "kernel",
    "libs/acpi-tables",
    "libs/address",
    "libs/boot-record",
    "libs/eevdf",
    "libs/elf64",
    "libs/entropy",
    "libs/fat32",
    "libs/frame-space",
    "libs/handle-space",
    "libs/lock-order",
    "libs/memory-map",
    "libs/mmio-range",
    "libs/native-abi",
    "libs/nvme",
    "libs/object-pool",
    "libs/panic-record",
    "libs/path-walk",
    "libs/pci-config",
    "libs/pixel",
    "libs/port-space",
    "libs/ps2-keys",
    "libs/register-bits",
    "libs/ring-proto",
    "libs/slab-layout",
    "libs/stack-layout",
    "libs/timebase",
    "libs/tlb-generation",
    "libs/trap-cause",
    "libs/vtd",
    "libs/wake-state",
    "libs/x86-apic",
    "libs/x86-cpuid",
    "libs/x86-paging",
    "libs/x86-pit",
    "libs/x86-tables",
    "wost",
    "xtask",
]

# Bare cargo commands cover the host half; the kernel crates go through the .cargo/config.toml aliases.
default-members = [
    "libs/acpi-tables",
    "libs/address",
    "libs/boot-record",
    "libs/eevdf",
    "libs/elf64",
    "libs/entropy",
    "libs/fat32",
    "libs/frame-space",
    "libs/handle-space",
    "libs/lock-order",
    "libs/memory-map",
    "libs/mmio-range",
    "libs/native-abi",
    "libs/nvme",
    "libs/object-pool",
    "libs/panic-record",
    "libs/path-walk",
    "libs/pci-config",
    "libs/pixel",
    "libs/port-space",
    "libs/ps2-keys",
    "libs/register-bits",
    "libs/ring-proto",
    "libs/slab-layout",
    "libs/stack-layout",
    "libs/timebase",
    "libs/tlb-generation",
    "libs/trap-cause",
    "libs/vtd",
    "libs/wake-state",
    "libs/x86-apic",
    "libs/x86-cpuid",
    "libs/x86-paging",
    "libs/x86-pit",
    "libs/x86-tables",
    "xtask",
]

[workspace.package]
version = "0.3.1"
edition = "2024"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/wizards-ecosystem/wizards-bedrock"

[workspace.dependencies]
acpi-tables = { path = "libs/acpi-tables" }
address = { path = "libs/address" }
boot-record = { path = "libs/boot-record" }
eevdf = { path = "libs/eevdf" }
elf64 = { path = "libs/elf64" }
entropy = { path = "libs/entropy" }
fat32 = { path = "libs/fat32" }
frame-space = { path = "libs/frame-space" }
handle-space = { path = "libs/handle-space" }
lock-order = { path = "libs/lock-order" }
memory-map = { path = "libs/memory-map" }
mmio-range = { path = "libs/mmio-range" }
native-abi = { path = "libs/native-abi" }
nvme = { path = "libs/nvme" }
object-pool = { path = "libs/object-pool" }
panic-record = { path = "libs/panic-record" }
path-walk = { path = "libs/path-walk" }
pci-config = { path = "libs/pci-config" }
pixel = { path = "libs/pixel" }
port-space = { path = "libs/port-space" }
ps2-keys = { path = "libs/ps2-keys" }
register-bits = { path = "libs/register-bits" }
ring-proto = { path = "libs/ring-proto" }
slab-layout = { path = "libs/slab-layout" }
stack-layout = { path = "libs/stack-layout" }
timebase = { path = "libs/timebase" }
tlb-generation = { path = "libs/tlb-generation" }
trap-cause = { path = "libs/trap-cause" }
vtd = { path = "libs/vtd" }
wake-state = { path = "libs/wake-state" }
x86-apic = { path = "libs/x86-apic" }
x86-cpuid = { path = "libs/x86-cpuid" }
x86-paging = { path = "libs/x86-paging" }
x86-pit = { path = "libs/x86-pit" }
x86-tables = { path = "libs/x86-tables" }

# limine 0.6 needs nightly; 0.5.0 builds on stable and requests base revision 4 via `with_revision`.
limine = "=0.5.0"
noto-sans-mono-bitmap = { version = "0.3", default-features = false, features = [
    "regular",
    "size_16",
    "unicode-basic-latin",
] }

# fatfs without default features avoids chrono, whose Windows bindings need dlltool.exe.
anyhow = "1"
fatfs = { version = "0.3", default-features = false, features = ["std", "alloc"] }
fscommon = "0.1"

proptest = { version = "1", default-features = false, features = ["std"] }
# proptest's std feature reaches getrandom through rand; 0.3.2 and later need dlltool.exe too.
getrandom = "=0.3.1"

# Members opt in with `[lints] workspace = true`; per-crate escalation lives in source attributes.
[workspace.lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"
unused_must_use = "deny"
unreachable_pub = "warn"
redundant_imports = "warn"
rust_2018_idioms = { level = "deny", priority = -1 }
unused_qualifications = "deny"

[workspace.lints.clippy]
# Every unsafe operation is documented, one per block, and every `pub unsafe fn` states its contract.
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
missing_safety_doc = "deny"
unwrap_used = "deny"
expect_used = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
unnecessary_safety_comment = "deny"
unnecessary_safety_doc = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
std_instead_of_core = "deny"
alloc_instead_of_core = "deny"
large_stack_arrays = "deny"
cast_lossless = "deny"
# House style: `Self`, `let else`, inline format arguments, assert messages and honest signatures.
use_self = "deny"
manual_let_else = "deny"
explicit_iter_loop = "deny"
cloned_instead_of_copied = "deny"
return_self_not_must_use = "deny"
clone_on_ref_ptr = "deny"
map_unwrap_or = "deny"
ref_option = "deny"
fn_params_excessive_bools = "deny"
semicolon_if_nothing_returned = "deny"
redundant_closure_for_method_calls = "deny"
missing_assert_message = "deny"
wildcard_imports = "deny"
items_after_statements = "deny"
uninlined_format_args = "deny"
match_same_arms = "deny"
manual_assert = "deny"
unused_self = "deny"
needless_pass_by_ref_mut = "deny"
trivially_copy_pass_by_ref = "deny"

[profile.release]
panic = "abort"
lto = true
# Debug info is in no PT_LOAD segment, so it costs the booted kernel nothing.
debug = true

[profile.dev]
panic = "abort"

# Only the `cargo xtask` alias selects this profile, so tests keep the plain dev profile.
[profile.xtask]
inherits = "dev"
opt-level = 3
