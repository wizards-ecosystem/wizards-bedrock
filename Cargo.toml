[workspace]
# A virtual manifest inherits no edition, so the resolver must be stated
# explicitly or cargo falls back to resolver 1. Resolver 3 is the edition-2024
# default and honours `rust-version` when picking dependency versions.
resolver = "3"
members = [
    "kernel",
    "libs/acpi-tables",
    "libs/eevdf",
    "libs/frame-space",
    "libs/pixel",
    "libs/port-space",
    "libs/ps2-keys",
    "libs/slab-layout",
    "libs/stack-layout",
    "libs/timebase",
    "libs/x86-apic",
    "libs/x86-paging",
    "libs/x86-pit",
    "libs/x86-tables",
    "wost",
    "xtask",
]

# Bare root commands are scoped to the half that builds for the host; the
# kernel crates are reached through the aliases in .cargo/config.toml, and
# `cargo xtask ci` runs both. See the README's Development section for why.
default-members = [
    "libs/acpi-tables",
    "libs/eevdf",
    "libs/frame-space",
    "libs/pixel",
    "libs/port-space",
    "libs/ps2-keys",
    "libs/slab-layout",
    "libs/stack-layout",
    "libs/timebase",
    "libs/x86-apic",
    "libs/x86-paging",
    "libs/x86-pit",
    "libs/x86-tables",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/limbwizard/the-wizards-os"

[workspace.dependencies]
# Our own no_std libraries: pure logic, host-testable.
acpi-tables = { path = "libs/acpi-tables" }
eevdf = { path = "libs/eevdf" }
frame-space = { path = "libs/frame-space" }
pixel = { path = "libs/pixel" }
port-space = { path = "libs/port-space" }
ps2-keys = { path = "libs/ps2-keys" }
slab-layout = { path = "libs/slab-layout" }
stack-layout = { path = "libs/stack-layout" }
timebase = { path = "libs/timebase" }
x86-apic = { path = "libs/x86-apic" }
x86-paging = { path = "libs/x86-paging" }
x86-pit = { path = "libs/x86-pit" }
x86-tables = { path = "libs/x86-tables" }

# Kernel side (no_std). 0.6.x of limine requires nightly (ptr_metadata);
# 0.5.0 builds on stable, and requests base revision 4 through
# `with_revision` (D-42) — crate version and protocol revision are distinct.
limine = "=0.5.0"
noto-sans-mono-bitmap = { version = "0.3", default-features = false, features = [
    "regular",
    "size_16",
    "unicode-basic-latin",
] }

# Host side (xtask). fatfs drops default features to avoid chrono, whose Windows
# bindings need dlltool.exe — absent from the GNU toolchain we build with.
anyhow = "1"
fatfs = { version = "0.3", default-features = false, features = ["std", "alloc"] }
fscommon = "0.1"

# Members opt in with `[lints] workspace = true`. Cargo rejects mixing that with
# sibling lint tables in the same manifest, so per-crate escalation lives in
# source attributes instead — see `#![forbid(unsafe_code)]` in every `libs/`
# crate, and the one `#![allow(unsafe_code)]` in `wost` (D-67).
[workspace.lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"
missing_debug_implementations = "warn"
unused_must_use = "deny"
unreachable_pub = "warn"

# Doc links rot silently: `missing_docs` notices a doc that is absent, nothing
# notices one that points at a name which has since been renamed or made
# private. These fire only under rustdoc, which is why `cargo xtask doc` is a
# gate step rather than an occasional habit (D-22).
[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"
redundant_explicit_links = "deny"

[workspace.lints.clippy]
# These three are the mechanical backstop for the framekernel discipline:
# every unsafe operation is documented, one operation per block, and every
# `pub unsafe fn` states its contract. `missing_docs_in_private_items` is
# deliberately absent — it manufactures comment noise.
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
missing_safety_doc = "deny"

[profile.release]
panic = "abort"
lto = true
# Debug info costs nothing at runtime (no PT_LOAD segment) and makes objdump/nm
# triage of a hung kernel possible.
debug = true

[profile.dev]
panic = "abort"
