[workspace]
# A virtual manifest inherits no edition, so the resolver must be stated
# explicitly or cargo falls back to resolver 1. Resolver 3 is the edition-2024
# default and honours `rust-version` when picking dependency versions.
resolver = "3"
members = [
    "kernel",
    "libs/acpi-tables",
    "libs/eevdf",
    "libs/elf64",
    "libs/fat32",
    "libs/frame-space",
    "libs/handle-space",
    "libs/memory-map",
    "libs/mmio-range",
    "libs/nvme",
    "libs/panic-record",
    "libs/path-walk",
    "libs/pci-config",
    "libs/pixel",
    "libs/port-space",
    "libs/ps2-keys",
    "libs/ring-proto",
    "libs/slab-layout",
    "libs/stack-layout",
    "libs/timebase",
    "libs/trap-cause",
    "libs/vtd",
    "libs/wizzy-handoff",
    "libs/x86-apic",
    "libs/x86-cpuid",
    "libs/x86-paging",
    "libs/x86-pit",
    "libs/x86-tables",
    "wost",
    "xtask",
]

# Bare root commands are scoped to the half that builds for the host; the
# kernel crates are reached through the aliases in .cargo/config.toml, and
# `cargo xtask ci` runs both. See the README's Development section for why.
default-members = [
    "libs/acpi-tables",
    "libs/eevdf",
    "libs/elf64",
    "libs/fat32",
    "libs/frame-space",
    "libs/handle-space",
    "libs/memory-map",
    "libs/mmio-range",
    "libs/nvme",
    "libs/panic-record",
    "libs/path-walk",
    "libs/pci-config",
    "libs/pixel",
    "libs/port-space",
    "libs/ps2-keys",
    "libs/ring-proto",
    "libs/slab-layout",
    "libs/stack-layout",
    "libs/timebase",
    "libs/trap-cause",
    "libs/vtd",
    "libs/wizzy-handoff",
    "libs/x86-apic",
    "libs/x86-cpuid",
    "libs/x86-paging",
    "libs/x86-pit",
    "libs/x86-tables",
    "xtask",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/wizards-ecosystem/wizards-bedrock"

[workspace.dependencies]
# Our own no_std libraries: pure logic, host-testable.
acpi-tables = { path = "libs/acpi-tables" }
eevdf = { path = "libs/eevdf" }
elf64 = { path = "libs/elf64" }
fat32 = { path = "libs/fat32" }
frame-space = { path = "libs/frame-space" }
handle-space = { path = "libs/handle-space" }
memory-map = { path = "libs/memory-map" }
mmio-range = { path = "libs/mmio-range" }
nvme = { path = "libs/nvme" }
panic-record = { path = "libs/panic-record" }
path-walk = { path = "libs/path-walk" }
pci-config = { path = "libs/pci-config" }
pixel = { path = "libs/pixel" }
port-space = { path = "libs/port-space" }
ps2-keys = { path = "libs/ps2-keys" }
ring-proto = { path = "libs/ring-proto" }
slab-layout = { path = "libs/slab-layout" }
stack-layout = { path = "libs/stack-layout" }
timebase = { path = "libs/timebase" }
trap-cause = { path = "libs/trap-cause" }
vtd = { path = "libs/vtd" }
wizzy-handoff = { path = "libs/wizzy-handoff" }
x86-apic = { path = "libs/x86-apic" }
x86-cpuid = { path = "libs/x86-cpuid" }
x86-paging = { path = "libs/x86-paging" }
x86-pit = { path = "libs/x86-pit" }
x86-tables = { path = "libs/x86-tables" }

# Kernel side (no_std). 0.6.x of limine requires nightly (ptr_metadata);
# 0.5.0 builds on stable, and requests base revision 4 through
# `with_revision` (D-42) — crate version and protocol revision are distinct.
limine = "=0.5.0"
noto-sans-mono-bitmap = { version = "0.3", default-features = false, features = [
    "regular",
    "size_16",
    "unicode-basic-latin",
] }

# Host side (xtask). fatfs drops default features to avoid chrono, whose Windows
# bindings need dlltool.exe — absent from the GNU toolchain we build with.
anyhow = "1"
fatfs = { version = "0.3", default-features = false, features = ["std", "alloc"] }
fscommon = "0.1"
fs_at = "=0.2.1"
libc = "=0.2.189"
proc-macro2 = { version = "1", features = ["span-locations"] }
syn = { version = "2", features = ["full", "visit"] }
# Windows job objects hold every process a bounded command starts (D-347). Its
# `winapi` backend uses no procedural macros, which the API audit forbids in the
# active graph (D-275); the modern `windows` crate would pull them in.
command-group = "=5.0.1"
# Safe GetFileInformationByHandle access keeps credential identity checks out of
# xtask's unsafe-forbidden source; its only dependency is already locked.
winapi-util = "=0.1.11"

# Host-only verification. D-242 admits `proptest` in the five pure libraries
# that state measured generated-input reach; `shuttle` remains confined to
# `libs/ring-proto`. These are dev-dependencies, so none reaches an OS image.
#
# `getrandom` is pinned because proptest's default features reach it and 0.3.2+
# needs a `windows-sys` this toolchain's `dlltool.exe` cannot link — the same
# wall `fatfs` avoids by dropping chrono. Recorded as the toolchain tax it is
# rather than left to be rediscovered (`010` §9).
proptest = { version = "1", default-features = false, features = ["std"] }
getrandom = "=0.3.1"
shuttle = "0.9"

# Members opt in with `[lints] workspace = true`. Cargo rejects mixing that with
# sibling lint tables in the same manifest, so per-crate escalation lives in
# source attributes instead — see `#![forbid(unsafe_code)]` in every `libs/`
# crate, and the one `#![allow(unsafe_code)]` in `wost` (D-67). `xtask` does
# not opt in (D-22): missing_docs on the host tool is noise.
#
# BeautifulRust's tested table (docs/style/BEAUTIFUL_RUST.md) is the style
# standard. Safety denies stay deny. Every newly adopted lint is warn, so
# `cargo check` and `cargo build` keep succeeding while other work clears the
# nits. `cargo xtask clippy` still passes `-D warnings` after `--`, and that
# gate stays red until the warnings are gone. Groups use priority -1 so an
# individual level in this table wins.
[workspace.lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"
missing_debug_implementations = "warn"
unused_must_use = "deny"
unreachable_pub = "warn"
# Bare trait objects, anonymous parameters, needless outlives bounds.
rust_2018_idioms = { level = "warn", priority = -1 }

# Doc links rot silently: `missing_docs` notices a doc that is absent, nothing
# notices one that points at a name which has since been renamed or made
# private. These fire only under rustdoc, which is why `cargo xtask doc` is a
# gate step rather than an occasional habit (D-22).
[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"
redundant_explicit_links = "deny"

[workspace.lints.clippy]
# Groups first, below the individual levels. `nursery` and the blanket
# `restriction` group stay off: nursery moves every release, and restriction
# includes `indexing_slicing`, which D-159 measured at 118 hits behind proofs
# the lint cannot see.
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# Panics: return errors. `expect("why")` stays the sanctioned form for a
# violated invariant (BeautifulRust). Kernel runtime paths still prefer
# `Result`; the libs that already deny `expect_used` keep that stricter
# attribute. `unwrap` is never that form.
unwrap_used = "warn"
expect_used = "allow"
panic_in_result_fn = "warn"
missing_panics_doc = "warn"
missing_errors_doc = "warn"
missing_assert_message = "warn"

# A suppression names the lint and says why, and `expect` drops out once the
# lint stops firing. `#[allow]` remains necessary inside macros, where an
# unfulfilled `expect` is not checked (D-131); those sites still need a reason.
allow_attributes = "warn"
allow_attributes_without_reason = "warn"

# Framekernel backstop. Stricter than BeautifulRust's warn. One unsafe
# operation per block, a `// SAFETY:` comment on it, and `# Safety` on every
# `pub unsafe fn`. `missing_docs_in_private_items` stays off on purpose: it
# manufactures comment noise.
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
missing_safety_doc = "deny"

# API shape. `max-fn-params-bools = 0` in clippy.toml, so any bool parameter
# warns. A two-variant enum is the call-site name (D-27).
fn_params_excessive_bools = "warn"
struct_excessive_bools = "warn"
clone_on_ref_ptr = "warn"
redundant_clone = "warn"
rc_buffer = "warn"
exhaustive_enums = "warn"

# Idiom and leftovers.
string_add = "warn"
wildcard_imports = "warn"
dbg_macro = "warn"
todo = "warn"
# xtask does not inherit this table. Kernel and libs log; they do not print.
print_stdout = "warn"
print_stderr = "warn"

# Casts. A blanket ban on `as` fights port-width, MMIO-width, and the
# sign-extending canonical-address arithmetic D-159 identified as the
# mechanism rather than a defect. Narrowing (`u64 as u32` and its kin) stays
# a warning: that one can hide a real loss. Lossless casts stay inside
# `pedantic` (`cast_lossless`).
as_conversions = "allow"
cast_possible_truncation = "warn"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"

# Pedantic noise BeautifulRust's tested config turns off, plus one kernel
# extra. `enum_variant_names` wants every variant prefixed with the type
# name, which repeats the namespace the module path already carries (005,
# Rust for Linux).
module_name_repetitions = "allow"
must_use_candidate = "allow"
module_inception = "allow"
enum_glob_use = "allow"
enum_variant_names = "allow"

[profile.release]
panic = "abort"
lto = true
# Debug info costs nothing at runtime (no PT_LOAD segment) and makes objdump/nm
# triage of a hung kernel possible.
debug = true

[profile.dev]
panic = "abort"

# The orchestrator binary hashes and parses the whole tree many times per gate;
# unoptimized it turns the API audit into hours. Only the `cargo xtask` alias
# selects this profile, so tests and audited graphs keep the plain dev
# profile (D-292).
[profile.xtask]
inherits = "dev"
opt-level = 3
