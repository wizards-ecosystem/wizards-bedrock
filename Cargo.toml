[workspace]
resolver = "2"
members = ["kernel", "xtask"]

[workspace.package]
edition = "2024"
license = "MIT"
repository = ""

# Kernel must never silently pull in std-dependent code; each crate opts into
# its own dependencies explicitly.

[profile.release]
panic = "abort"
lto = true

[profile.dev]
panic = "abort"
